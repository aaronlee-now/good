<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Claw Machine — Fun Games</title>
  <meta name="description" content="Move the claw, drop it, and grab a prize!" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="claw.css" />
</head>
<body>
  <div class="page">
    <a class="back-link" href="index.html">&larr; Fun Games</a>

    <div class="cabinet" id="cabinet">
      <!-- Row of blinking arcade bulbs -->
      <div class="marquee" aria-hidden="true">
        <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
        <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
        <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
        <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
      </div>

      <h1 class="brand">CLAW TIME</h1>
      <p class="tagline">Grab a prize. Make it count.</p>

      <div class="window">
        <canvas id="game" width="420" height="480" aria-label="Claw machine game"></canvas>
      </div>

      <div class="panel">
        <div class="stat">
          <span class="stat-label">Tickets</span>
          <strong id="tickets">0</strong>
        </div>
        <div class="stat">
          <span class="stat-label">Tries left</span>
          <strong id="tries">3</strong>
        </div>
        <div class="stat prize-stat">
          <span class="stat-label">Last prize</span>
          <strong id="last-prize">—</strong>
        </div>
      </div>

      <div class="controls">
        <button type="button" class="ctrl-btn" id="btn-left" aria-label="Move left">◀</button>
        <button type="button" class="ctrl-btn drop" id="btn-drop">DROP</button>
        <button type="button" class="ctrl-btn" id="btn-right" aria-label="Move right">▶</button>
      </div>
      <p class="hint">Arrow keys move · Space drops</p>
    </div>

    <!-- Start / result overlay -->
    <div class="overlay" id="overlay">
      <div class="overlay-inner">
        <p class="overlay-brand">CLAW TIME</p>
        <h2 id="overlay-title">Win a prize</h2>
        <p id="overlay-text">Move the claw. Drop it on a prize. Different prizes are worth different tickets!</p>
        <button type="button" class="start-btn" id="start-btn">Start Now</button>
      </div>
    </div>
  </div>

  <script src="claw.js"></script>
</body>
</html>
